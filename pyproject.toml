[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DMI"
version = "1.2.0"
description = "A decoupled, asynchronous observation substrate for high-speed LLM inference."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.optional-dependencies]
s3 = ["boto3>=1.40,<2"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
# Runtime code has one canonical namespace. Native sources and external
# repositories live under ``native/`` and ``third_party/``.
where = ["src"]
include = ["dmi*"]

[tool.pytest.ini_options]
# `manual` tools and native-ring sources are not collected by default. The
# lightweight PR gate should select true CPU tests explicitly:
#   python -m pytest -m "cpu" -q
addopts = "-ra -m 'not manual'"
pythonpath = ["src"]
norecursedirs = ["tests/tools", "tests/native", ".venv", "native", "third_party", "build"]
markers = [
    "cpu: pure-CPU contract/unit test (no CUDA / ClickHouse / model weights / native extension build required)",
    "gpu: requires a CUDA device",
    "multi_gpu: requires >= 2 CUDA devices (TP / EP / routing)",
    "e2e: end-to-end pipeline through the native backend + host engine",
    "clickhouse: requires a reachable ClickHouse instance",
    "hf: requires HuggingFace weights / model cache",
    "native_backend: requires the DMI native backend .so importable/built; no GPU necessarily",
    "framework_fork: requires vendored/modified framework forks importable",
    "ring_native: native CUDA ring tests built via tests/native/ring/Makefile (needs nvcc)",
    "slow: tests that take more than ~30 s (per-hook isolation full sweep, large E2E sweeps); skipped by default unless `-m slow` is passed",
    "manual: investigation / tooling, not a regression gate; not collected by default",
    "garage: requires a reachable Garage S3-compatible endpoint",
    "numeric: per-hook numeric-difference study (drift vs the unhooked baseline)",
]
