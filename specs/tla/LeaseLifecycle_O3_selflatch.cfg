\*=========================================================================
\* O3, the sharp case: NO rival publisher exists at all.  Skew = 1 tick, so
\* a lagging replica reports a row live one tick past its TTL, while the
\* quarantine window (catalog_writer.cpp:273) is measured on the local clock
\* with no skew allowance: the writer can still be refused by its OWN dropped
\* row when its quarantine ends (O2_selfref).  At 99ee4ae that refusal fed
\* the 2 x TTL latch and the service latched against itself (REFUTED).  Since
\* #159, lease_held_elsewhere() resets the clock on a refusal by the
\* writer's own claim rows (storage_service.cpp:1682-1696).
\* EXPECT: HOLDS (NoFalsePositiveLatch and NeverLatches); vac_ownrefusal proves the self-refusal is still
\* reached at these constants.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 1
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 24
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 0
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT NoFalsePositiveLatch
INVARIANT NeverLatches
