\* VACUITY: a dead process's pack uploaded by another service is reachable.
\* EXPECT: VIOLATED (VacAdopted).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {p1, p2}
  Stagers          = {p1, p2}
  Adopters         = {p1, p2}
  CrashProcs       = {p1, p2}
  Survivor         = NoP
  BadProcs         = {}
  MaxQuar          = 0
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = FALSE
  SkipDirLock      = FALSE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = TRUE
  Track            = TRUE
INVARIANT VacAdopted
