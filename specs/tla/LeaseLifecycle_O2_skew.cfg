\*=========================================================================
\* O2 with clock_skew = one tick: the quarantine window
\* (catalog_writer.cpp:273, now + lease_ttl on the local clock) does not
\* outlast the dropped row as a lagging replica sees it.  Unchanged by
\* #159.  EXPECT: REFUTED.  Since #159 the consequence is a refusal by the
\* writer's own row, which lease_held_elsewhere() no longer counts (O3_selflatch).
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 1
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 14
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 1
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 0
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT QuarantineOutlastsItsRow
