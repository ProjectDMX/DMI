\*=========================================================================
\* #159: one timed-out claim at start(), sent or not, landed or not, with a
\* lagging replica, does not fail start() at the default wait
\* (ttl + publish_timeout + skew).  The constraint stops expansion once a
\* service leaves start().  EXPECT: HOLDS.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTRAINT StartPhaseOnly
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 1
  PredTTL          = 6
  StartWait        = 7
  MaxTime          = 16
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 3
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT StartPastOneSlowClaim
