\*=========================================================================
\* O1a under OS lateness: lease-thread wakes up to MaxLate = 4 ticks late,
\* the idle service.  At 99ee4ae MaxLate stood in for a slow request and this
\* was REFUTED (the row expired under a service that still held it).  Since
\* #159 a lease past its deadline is abandoned at the next LeaseScope and
\* nothing is sent under it.  EXPECT: HOLDS.  Slow REQUESTS proper are
\* O1_slowreq_req; the remaining belief gap is O1_belief.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 14
  MaxLate          = 4
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = FALSE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 0
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT NoPhantomLease
INVARIANT QuarantineTakesNothing
INVARIANT NoConcurrentHolder
