\*=========================================================================
\* O1a when a lease request is SLOW.  The model settles every ClickHouse
\* call in zero time; in the code keep_lease() holds lease_mutex_ across
\* renew_lease(), so a request that takes k ticks delays the next wake by
\* k.  MaxLate stands in for that delay.  No cycle (CycleOn FALSE), so
\* only the lease thread renews: the idle service.  MaxLate = 3 (half the
\* TTL) still holds; MaxLate = 4 lets the row expire under a service
\* that still believes it holds it.  EXPECT: VIOLATED.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 14
  MaxLate          = 4
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = FALSE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
INVARIANT NoPhantomLease
INVARIANT QuarantineTakesNothing
INVARIANT NoConcurrentHolder
