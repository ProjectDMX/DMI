\* LIVENESS, no crash, reconcile off: every staged pack is
\* eventually indexed by the service alone.
\* EXPECT: HOLDS.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Packs = {1, 2}
  Chunk = 1
  ReconcileOnStart = FALSE
  ReconcilePeriodic = FALSE
  MaxRestarts = 0
  MaxCrashes = 0
  MaxLeaseLosses = 1
  MaxFaults = 1
  AllowClose = FALSE
  AllowUserFlush = FALSE
  CheckLeaseBeforeFirstChunk = FALSE
  GateUploadsOnLease = TRUE
  GateUploadsOnOwed = TRUE
  ReleaseStagesTail = TRUE
  FirstBatchOnly = TRUE
  ReconcileFailuresOwed = FALSE
  FlushRunsReconcile = FALSE
PROPERTY EventuallyIndexed
