\*=========================================================================
\* O1a with SLOW REQUESTS, the idle service (lease thread only).  Before
\* #159 a request that took over half the TTL let the row expire under a
\* service that still held it (O1_slowreq, MaxLate 4).  Now every request
\* under the lease is cut at the deadline, and a lease past it is abandoned.
\* MaxReq = 4 ticks (2/3 of the TTL).  EXPECT: HOLDS.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 14
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = FALSE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 4
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT NoPhantomLease
INVARIANT NoRequestPastDeadline
INVARIANT NoConcurrentHolder
INVARIANT QuarantineTakesNothing
INVARIANT TypeOK
