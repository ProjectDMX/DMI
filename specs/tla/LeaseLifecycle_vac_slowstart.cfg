\*=========================================================================
\* VACUITY GUARD for O4_slowstart -- MUST BE REFUTED: a start that took a
\* timed-out claim does get its lease (phase sweep).
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTRAINT StartPhaseOnly
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 1
  PredTTL          = 6
  StartWait        = 7
  MaxTime          = 16
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 3
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT VacStartUnk
