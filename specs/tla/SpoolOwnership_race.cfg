\* Three processes, reduced: p1 stages, and crashes or closes; p2 and p3
\* adopt, each with a lease of its own (ExclusiveLease FALSE), so the two
\* race for p1's directory -- one removing it while the other takes it.
\* EXPECT: HOLDS.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {p1, p2, p3}
  Stagers          = {p1}
  Adopters         = {p2, p3}
  CrashProcs       = {p1, p2, p3}
  Survivor         = NoP
  BadProcs         = {}
  MaxQuar          = 0
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = FALSE
  SkipDirLock      = FALSE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = FALSE
  Track            = FALSE
INVARIANT TypeOK MutualExclusion NoClobber NoLostPack NoConcurrentUpload OwedBounded NoOrphan BlockedLetGo UploadOnlyWithLease
SYMMETRY AdopterPerms
