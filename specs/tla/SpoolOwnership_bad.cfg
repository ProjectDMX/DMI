\* The real protocol, three processes, p1's pack can never be uploaded
\* (UploadFailure::retryable false): an adopter blocks p1's directory,
\* marks it and lets it go; a second adopter may take it again.
\* EXPECT: HOLDS.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {p1, p2, p3}
  Stagers          = {p1}
  Adopters         = {p2, p3}
  CrashProcs       = {p1, p2, p3}
  Survivor         = NoP
  BadProcs         = {p1}
  MaxQuar          = 0
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = FALSE
  SkipDirLock      = FALSE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = FALSE
  Track            = FALSE
INVARIANT TypeOK MutualExclusion NoClobber NoLostPack NoConcurrentUpload OwedBounded NoOrphan BlockedLetGo UploadOnlyWithLease
SYMMETRY AdopterPerms
