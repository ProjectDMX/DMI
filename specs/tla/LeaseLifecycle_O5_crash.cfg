\*=========================================================================
\* O5 with a crash: the first process dies (its flock goes, its row stays
\* live with no tombstone), and a successor constructed later on the same
\* spool takes the lock, waits out the row and sweeps.  EXPECT: HOLDS.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1,s2}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 14
  MaxTime          = 14
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = FALSE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 0
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = TRUE
  OwnerLock        = TRUE
  LateStart        = TRUE
  AllowCrash       = TRUE
INVARIANT SweepOnlyWhenAlone
INVARIANT RefusedStartNeverSweeps
