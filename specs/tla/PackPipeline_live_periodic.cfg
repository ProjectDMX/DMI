\* LIVENESS across a crash, reconcile at start and periodic.
\* EXPECT: HOLDS.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  Packs = {1, 2}
  Chunk = 1
  ReconcileOnStart = TRUE
  ReconcilePeriodic = TRUE
  MaxRestarts = 1
  MaxCrashes = 1
  MaxLeaseLosses = 1
  MaxFaults = 1
  AllowClose = FALSE
  AllowUserFlush = FALSE
  CheckLeaseBeforeFirstChunk = FALSE
  GateUploadsOnLease = TRUE
  GateUploadsOnOwed = TRUE
  ReleaseStagesTail = TRUE
  FirstBatchOnly = TRUE
  ReconcileFailuresOwed = FALSE
  FlushRunsReconcile = FALSE
