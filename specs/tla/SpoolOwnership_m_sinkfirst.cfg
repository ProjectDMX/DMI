\* MUTATION: the sink opens before the service's start() sweep, which
\* deletes every .open file not in the SERVICE's Spool object.
\* EXPECT: VIOLATED (NoClobber).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {p1, p2}
  Stagers          = {p1, p2}
  Adopters         = {p1, p2}
  CrashProcs       = {p1, p2}
  Survivor         = NoP
  BadProcs         = {}
  MaxQuar          = 0
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = FALSE
  SkipDirLock      = FALSE
  SinkFirst        = TRUE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = TRUE
  Track            = FALSE
INVARIANT TypeOK MutualExclusion NoClobber NoLostPack NoConcurrentUpload OwedBounded NoOrphan BlockedLetGo UploadOnlyWithLease
