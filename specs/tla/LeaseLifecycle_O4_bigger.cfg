\*=========================================================================
\* O4: a predecessor that ran with a LARGER TTL -- the native 30 s
\* default the config comment (native_capture.py:140-145) warns
\* about.  PredTTL 12 against a service configured for 6, so the
\* default wait is still 7.  EXPECT: REFUTED, confirming the comment.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 12
  StartWait        = 7
  MaxTime          = 16
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = FALSE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = TRUE
  AllowStop        = FALSE
  MaxReacq         = 2
INVARIANT StartAlwaysSucceeds
