\* Liveness: s never crashes or closes; q may.  A pack q staged before it
\* died is eventually uploaded by some live service.  Today's single
\* publisher (ExclusiveLease), a lease that is never lost (MaxQuar 0): q
\* can only serve before s does, and s's look then finds q.
\* EXPECT: HOLDS.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {s, q}
  Stagers          = {s, q}
  Adopters         = {s, q}
  CrashProcs       = {q}
  Survivor         = s
  BadProcs         = {}
  MaxQuar          = 0
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = FALSE
  SkipDirLock      = FALSE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = TRUE
  Track            = FALSE
PROPERTY AdoptLive
