\*=========================================================================
\* O3, the negative direction, done properly: the rival can only get in
\* while a ClickHouse cut stops the incumbent renewing -- which is exactly
\* how test_a_rival_that_stops_within_two_ttls_does_not_latch stages it.
\* One cut, and a rival pinned to stop by t = TTL (well inside 2 x TTL).
\* EXPECT: HOLDS -- the service takes the lease back and never latches.
\* (The earlier O3_stops run, with no cut, was VACUOUS: the rival could
\* never claim at all.  vac_stops_refusal below proves this one is not.)
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 22
  MaxLate          = 0
  Foreign          = TRUE
  ForeignStops     = TRUE
  ForeignBudget    = 1
  ForeignStopBy    = 6
  MaxCuts          = 1
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
INVARIANT VacRefusal
