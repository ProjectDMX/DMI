\*=========================================================================
\* O3, the positive direction: a rival that takes the catalog and
\* keeps renewing.  test_a_rival_that_takes_over_during_a_cut_still_latches
\* says the service must latch.  EXPECT: REFUTED (i.e. the latch IS
\* reached), and the trace shows it at >= 2 x TTL after the rival.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 22
  MaxLate          = 0
  Foreign          = TRUE
  ForeignStops     = FALSE
  ForeignBudget    = 1
  ForeignStopBy    = 99
  MaxCuts          = 1
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
INVARIANT NoFalsePositiveLatch
