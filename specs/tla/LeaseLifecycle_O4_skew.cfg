\*=========================================================================
\* O4: the same, with a replica lagging by one tick.  This is
\* exactly what 2b74d14 added clock_skew_s to the default for.
\* EXPECT: HOLDS (start wait 6 + 1 + 1 = 8).
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 1
  PredTTL          = 6
  StartWait        = 8
  MaxTime          = 12
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = FALSE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = TRUE
  AllowStop        = FALSE
  MaxReacq         = 2
INVARIANT StartAlwaysSucceeds
