\* to_noovr0 with AllowOverrun.  EXPECT: NoOverlappingAdmit VIOLATED -- the
\* takeover is reached at these constants, so to_noovr0 holding is not vacuous.
SPECIFICATION Spec
CONSTANTS
  Publishers = {p1, p2}
  SelfRace   = FALSE
  Lids       = {1, 2, 3}
  MaxTerm    = 4
  MaxTime    = 8
  MaxVersion = 2
  MaxAttempts = 1
  TTL  = 2
  PT   = 1
  SKEW = 0
  NumChunks = 0
  Linearizable   = TRUE
  AllowOverrun   = TRUE
  WriterLock     = TRUE
  FreshPublishId = TRUE
  Timeouts       = TRUE
CONSTRAINT Bound
INVARIANT NoOverlappingAdmit
CHECK_DEADLOCK FALSE
