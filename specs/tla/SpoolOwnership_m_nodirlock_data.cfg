\* The same mutation, checked for harm to the data: every invariant but
\* MutualExclusion.  The overlap is benign: the directory is already
\* drained, and the remover's rmdir fails on the newcomer's lock file.
\* EXPECT: HOLDS.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {p1, p2, p3}
  Stagers          = {p1}
  Adopters         = {p2, p3}
  CrashProcs       = {p1, p2, p3}
  Survivor         = NoP
  BadProcs         = {}
  MaxQuar          = 0
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = FALSE
  SkipDirLock      = TRUE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = FALSE
  Track            = FALSE
INVARIANT TypeOK NoClobber NoLostPack NoConcurrentUpload OwedBounded NoOrphan BlockedLetGo UploadOnlyWithLease
SYMMETRY AdopterPerms
