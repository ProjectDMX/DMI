\* Non-vacuity guard for base5: the base5 constants with the statement cap
\* allowed to overrun (AllowOverrun TRUE).  base5's AllSafety HOLDS means
\* something only if the takeover race is reachable at these constants;
\* this run reaches it.  EXPECT: NoOverlappingAdmit VIOLATED.
SPECIFICATION Spec
CONSTANTS
  Publishers = {p1, p2}
  SelfRace   = FALSE
  Lids       = {1, 2}
  MaxTerm    = 5
  MaxTime    = 8
  MaxVersion = 2
  MaxAttempts = 1
  TTL  = 2
  PT   = 1
  SKEW = 0
  NumChunks = 1
  Linearizable   = TRUE
  AllowOverrun   = TRUE
  WriterLock     = TRUE
  FreshPublishId = TRUE
CONSTRAINT Bound
INVARIANT NoOverlappingAdmit
CHECK_DEADLOCK FALSE
