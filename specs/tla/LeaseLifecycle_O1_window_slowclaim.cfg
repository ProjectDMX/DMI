\*=========================================================================
\* O1b' after a SLOW claim: the claim's INSERT and read-back may each take
\* up to CB = TTL/3, so it is confirmed up to 2 x TTL/3 after the send; the
\* lease thread then waits a full tick (:1386) before its first look, and
\* the first renewal starts 5 x TTL/6 after the send.  The comment's
\* 'within half the TTL' does not hold.  EXPECT: REFUTED.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 14
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = FALSE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 4
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT RenewalStartsByHalf
