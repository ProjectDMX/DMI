\*=========================================================================
\* The deadline against a rival that sees our row dead a tick EARLY
\* (RivalEarly 1), with clock_skew configured to match (CfgSkew 1): the
\* lease is never usable after the rival can take it.  EXPECT: HOLDS.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 16
  MaxLate          = 0
  Foreign          = TRUE
  ForeignStops     = FALSE
  ForeignBudget    = 1
  ForeignStopBy    = 99
  MaxCuts          = 0
  AllowUnknown     = FALSE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 4
  CfgSkew          = 1
  RivalEarly       = 1
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT NoConcurrentHolder
INVARIANT NoPhantomLease
