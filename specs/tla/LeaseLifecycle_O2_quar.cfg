\*=========================================================================
\* O2: quarantine.  One cut, outcome-unknown writes allowed, no skew.  Does
\* the one-TTL window outlast the row it dropped, and can a quarantined
\* writer ever hold?  EXPECT: HOLDS.  The model lands an unknown-outcome
\* INSERT no later than the client gave up on it, which add_write_caps
\* (lease_coordinator.cpp:112-143) now gives the server as
\* max_execution_time; see LIMITS 4 for what the caps do not cover.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 14
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 1
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 0
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT QuarantineTakesNothing
INVARIANT QuarantineOutlastsItsRow
INVARIANT NoConcurrentHolder
