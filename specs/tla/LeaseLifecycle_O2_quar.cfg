\*=========================================================================
\* O2: quarantine.  One cut, outcome-unknown writes allowed, no
\* skew.  Does the one-TTL window really outlast the row it dropped,
\* and can a quarantined writer ever hold?  EXPECT: HOLDS.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 14
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 1
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
INVARIANT QuarantineTakesNothing
INVARIANT QuarantineOutlastsItsRow
INVARIANT NoConcurrentHolder
