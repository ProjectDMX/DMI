\* VACUITY: a directory holding a Bad pack is blocked is reachable.
\* EXPECT: VIOLATED (VacBlocked).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {p1, p2}
  Stagers          = {p1, p2}
  Adopters         = {p1, p2}
  CrashProcs       = {p1, p2}
  Survivor         = NoP
  BadProcs         = {p1}
  MaxQuar          = 0
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = FALSE
  SkipDirLock      = FALSE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = TRUE
  Track            = TRUE
INVARIANT VacBlocked
