\*=========================================================================
\* O4 composed with quarantine and the latch: the successor takes
\* the predecessor's lease after the wait, then meets a ClickHouse
\* cut and a rival.  Does the wait compose?  EXPECT: HOLDS for
\* NoConcurrentHolder; the latch invariant is checked separately.
\* The cycle is off (CycleOn FALSE) since the 5b3b632 re-sync: with requests
\* as separate issue and completion steps it took the run past 20M states,
\* and the cycle adds no claim instant the lease thread lacks at TTL 6.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 7
  MaxTime          = 18
  MaxLate          = 0
  Foreign          = TRUE
  ForeignStops     = FALSE
  ForeignBudget    = 1
  ForeignStopBy    = 99
  MaxCuts          = 1
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = TRUE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 0
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT NoConcurrentHolder
INVARIANT QuarantineTakesNothing
