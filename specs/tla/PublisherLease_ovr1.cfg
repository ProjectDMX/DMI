\* noovr1 with the statement cap allowed to overrun (AllowOverrun TRUE):
\* the non-vacuity guard for noovr1.  EXPECT: NoOverlappingAdmit VIOLATED.
SPECIFICATION Spec
CONSTANTS
  Publishers = {p1, p2}
  SelfRace   = FALSE
  Lids       = {1, 2, 3}
  MaxTerm    = 4
  MaxTime    = 8
  MaxVersion = 2
  MaxAttempts = 1
  TTL  = 2
  PT   = 1
  SKEW = 0
  NumChunks = 1
  Linearizable   = TRUE
  AllowOverrun   = TRUE
  WriterLock     = TRUE
  FreshPublishId = TRUE
CONSTRAINT Bound
INVARIANT NoOverlappingAdmit
CHECK_DEADLOCK FALSE
