\*=========================================================================
\* O5: two processes on ONE spool.  Since #163 the constructor's
\* Spool::Open takes the directory's owner lock (storage_service.cpp:213-221),
\* so a second LIVE process cannot construct at all, and the pre-#163 trace
\* (s1 quarantined, s2 takes the lapsed lease and sweeps s1's .open files)
\* is gone.  EXPECT: HOLDS.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1,s2}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 14
  MaxTime          = 16
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 1
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 0
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = TRUE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT SweepOnlyWhenAlone
