\*=========================================================================
\* O3, the sharp case: NO rival publisher exists at all.  Skew = 1 tick, so
\* a lagging replica reports a row as live one tick past its TTL, while the
\* quarantine window (catalog_writer.cpp:273) is measured on the LOCAL
\* monotonic clock and carries no skew allowance.  A writer can therefore be
\* refused by its OWN dropped row at the instant its quarantine ends.
\* Each such refusal feeds storage_service.cpp:729-745, whose clock is never
\* reset except by a SUCCESSFUL claim.  EXPECT: REFUTED -- the service
\* latches "publisher lease held by another publisher" with no other
\* publisher in existence.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 1
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 24
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
INVARIANT NeverLatches
