\*=========================================================================
\* O1a with non-publishing stretches (AllowSkipPublish): an index pass whose
\* packs were ALL already committed publishes nothing (indexer.cpp:322).
\* Before #159, storage_service.cpp bumped last_renew_ns_ for it anyway and
\* the row could lapse under a service that still held it (REFUTED at
\* 99ee4ae).  Since #159 nothing stamps a renewal but a confirmed claim
\* (storage_service.cpp:1194-1200); such a stretch renews only if due.
\* EXPECT: HOLDS (the pre-#159 defect is gone).
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 16
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = FALSE
  AllowSkipPublish = TRUE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 0
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT NoPhantomLease
