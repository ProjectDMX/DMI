\*=========================================================================
\* O3: a rival refuses the service, stops, and comes back while the
\* service's own claim -- which got past the head read, so it found NO live
\* rival -- timed out with its INSERT sent.  held_elsewhere_since_ns_ is reset
\* only by a success or a refusal by our own rows, so the latch clock runs
\* from the FIRST rival's refusal.  EXPECT: REFUTED (NoFalsePositiveLatch).
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 26
  MaxLate          = 0
  Foreign          = TRUE
  ForeignStops     = TRUE
  ForeignBudget    = 2
  ForeignStopBy    = 99
  MaxCuts          = 1
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 0
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT NoFalsePositiveLatch
