\* Several services serving one catalog key at once, each with a lease of
\* its own (ExclusiveLease FALSE: today only across a lease takeover; the
\* shape upload-only services per rank would have).  Two processes, one
\* quarantine.
\* EXPECT: HOLDS.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {p1, p2}
  Stagers          = {p1, p2}
  Adopters         = {p1, p2}
  CrashProcs       = {p1, p2}
  Survivor         = NoP
  BadProcs         = {}
  MaxQuar          = 1
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = FALSE
  SkipDirLock      = FALSE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = FALSE
  Track            = FALSE
INVARIANT TypeOK MutualExclusion NoClobber NoLostPack NoConcurrentUpload OwedBounded NoOrphan BlockedLetGo UploadOnlyWithLease
SYMMETRY Perms
