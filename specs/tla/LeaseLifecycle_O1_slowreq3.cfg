\*=========================================================================
\* O1a when a lease request is slow, at the largest delay that still
\* holds: the partner of LeaseLifecycle_O1_slowreq.cfg, with MaxLate = 3
\* (half the TTL) instead of 4.  No cycle (CycleOn FALSE), so only the
\* lease thread renews.  EXPECT: HOLDS.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 14
  MaxLate          = 3
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = FALSE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
INVARIANT NoPhantomLease
INVARIANT QuarantineTakesNothing
INVARIANT NoConcurrentHolder
