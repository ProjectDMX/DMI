\* noovr0's constants with ONE manifest chunk instead of an empty-refs
\* publish, cap enforced.  EXPECT: NoOverlappingAdmit HOLDS.  Its partner
\* PublisherLease_ovr1.cfg (the same with AllowOverrun) is refuted, so this
\* HOLDS is not vacuous.  About 15M states: a manual run, not in check.sh.
SPECIFICATION Spec
CONSTANTS
  Publishers = {p1, p2}
  SelfRace   = FALSE
  Lids       = {1, 2, 3}
  MaxTerm    = 4
  MaxTime    = 8
  MaxVersion = 2
  MaxAttempts = 1
  TTL  = 2
  PT   = 1
  SKEW = 0
  NumChunks = 1
  Linearizable   = TRUE
  AllowOverrun   = FALSE
  WriterLock     = TRUE
  FreshPublishId = TRUE
CONSTRAINT Bound
INVARIANT NoOverlappingAdmit
CHECK_DEADLOCK FALSE
