    Cap            = 6
    Staging        = 5
    TaskCap        = 4
    MaxBytes       = 3
    MaxHooks       = 2
    MaxSteps       = 5
    Wrap           = 100
    Record         = FALSE
    NeedsEager     = FALSE
    PrefixMismatch = FALSE
    GateMismatch   = FALSE
INVARIANTS
    TypeOK
    Safety
    Covered
    NoWrap
    Exact
