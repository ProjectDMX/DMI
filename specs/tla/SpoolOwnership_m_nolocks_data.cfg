\* Neither IsFileAt nor LockDirectory, checked for harm to the data.  A
\* second owner only ever overlaps a remover whose directory is already
\* drained and whose last step (rmdir) then fails or finds nothing, so no
\* pack is lost, clobbered or uploaded twice.  The directory lock's own
\* stated reason -- a lock file removed under a LIVE owner by a person or
\* a cleaner (spool.h) -- is not modelled.
\* EXPECT: HOLDS.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {p1, p2, p3}
  Stagers          = {p1}
  Adopters         = {p2, p3}
  CrashProcs       = {p1, p2, p3}
  Survivor         = NoP
  BadProcs         = {}
  MaxQuar          = 0
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = TRUE
  SkipDirLock      = TRUE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = FALSE
  Track            = FALSE
INVARIANT TypeOK NoClobber NoLostPack NoConcurrentUpload OwedBounded NoOrphan BlockedLetGo UploadOnlyWithLease
SYMMETRY AdopterPerms
