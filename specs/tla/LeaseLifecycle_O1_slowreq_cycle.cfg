\*=========================================================================
\* O1a with slow requests, a cut, unknown outcomes, and the cycle's
\* lease-locked stretches (publishing or not) competing with the lease
\* thread for lease_mutex_.  EXPECT: HOLDS.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 12
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 1
  AllowUnknown     = TRUE
  AllowSkipPublish = TRUE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 4
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT NoPhantomLease
INVARIANT NoRequestPastDeadline
INVARIANT NoConcurrentHolder
INVARIANT QuarantineTakesNothing
INVARIANT TypeOK
