\* The strict reading of decision 7 -- nothing only one process
\* remembers is ever lost with it -- with reconcile_on_start off.
\* Not the code's claim: it accepts one chunk in the gap.
\* EXPECT: VIOLATED (accepted window).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Packs = {1, 2}
  Chunk = 1
  ReconcileOnStart = FALSE
  ReconcilePeriodic = FALSE
  MaxRestarts = 1
  MaxCrashes = 1
  MaxLeaseLosses = 1
  MaxFaults = 1
  AllowClose = TRUE
  AllowUserFlush = TRUE
  CheckLeaseBeforeFirstChunk = TRUE
  GateUploadsOnLease = TRUE
  GateUploadsOnOwed = TRUE
  ReleaseStagesTail = TRUE
  FirstBatchOnly = TRUE
  ReconcileFailuresOwed = FALSE
  FlushRunsReconcile = FALSE
INVARIANT NoOrphanEver
