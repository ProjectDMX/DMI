\* ovr0 constants (AllowOverrun) checking WatermarkMonotonic: the overrun
\* residual reorders watermark rows, which PackRank.tla shows a pinned read
\* depends on.  Timeouts off.
SPECIFICATION Spec
CONSTANTS
  Publishers = {p1, p2}
  SelfRace   = FALSE
  Lids       = {1, 2, 3}
  MaxTerm    = 4
  MaxTime    = 8
  MaxVersion = 2
  MaxAttempts = 1
  TTL  = 2
  PT   = 1
  SKEW = 0
  NumChunks = 0
  Linearizable   = TRUE
  AllowOverrun   = TRUE
  WriterLock     = TRUE
  FreshPublishId = TRUE
  Timeouts       = FALSE
CONSTRAINT Bound
INVARIANT WatermarkMonotonic
CHECK_DEADLOCK FALSE
