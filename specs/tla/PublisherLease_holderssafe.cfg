\* BASE MODEL: the protocol exactly as shipped.
\* Linearizable store (select_sequential_consistency=1, clickhouse_client.cpp:107),
\* max_execution_time enforced, writer lock held, fresh publish_id per call.
SPECIFICATION Spec
CONSTANTS
  Publishers = {p1, p2}
  SelfRace   = FALSE
  Lids       = {1, 2, 3}
  MaxTerm    = 3
  MaxTime    = 5
  MaxVersion = 2
  MaxAttempts = 2
  TTL  = 2
  PT   = 1
  SKEW = 0
  NumChunks = 1
  Linearizable   = TRUE
  AllowOverrun   = FALSE
  WriterLock     = TRUE
  FreshPublishId = TRUE
CONSTRAINT Bound
INVARIANT TwoHoldersIsSafe
CHECK_DEADLOCK FALSE
