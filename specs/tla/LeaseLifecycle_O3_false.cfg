\*=========================================================================
\* O3: is 2 x TTL enough to TELL the two apart?  A rival that
\* stops inside two TTLs, plus one ClickHouse cut.
\* NoFalsePositiveLatch says a latched service really did face an
\* unbroken run of foreign refusals.  EXPECT: REFUTED.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 22
  MaxLate          = 0
  Foreign          = TRUE
  ForeignStops     = TRUE
  ForeignBudget    = 1
  ForeignStopBy    = 6
  MaxCuts          = 1
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = TRUE
  PredHolds        = FALSE
  AllowStop        = FALSE
  MaxReacq         = 2
INVARIANT NoFalsePositiveLatch
