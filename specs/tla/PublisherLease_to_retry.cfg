\* chunks2 constants with an empty-refs publish, the #159 timeouts and MaxAttempts 2: a
\* writer that gave up claims again (fresh lease_id, no quarantine wait) while
\* its abandoned statement may still be in flight.  EXPECT: AllSafety HOLDS.
SPECIFICATION Spec
CONSTANTS
  Publishers = {p1, p2}
  SelfRace   = FALSE
  Lids       = {1, 2, 3}
  MaxTerm    = 3
  MaxTime    = 5
  MaxVersion = 1
  MaxAttempts = 2
  TTL  = 2
  PT   = 1
  SKEW = 0
  NumChunks = 0
  Linearizable   = TRUE
  AllowOverrun   = FALSE
  WriterLock     = TRUE
  FreshPublishId = TRUE
  Timeouts       = TRUE
CONSTRAINT Bound
INVARIANT AllSafety
CHECK_DEADLOCK FALSE
