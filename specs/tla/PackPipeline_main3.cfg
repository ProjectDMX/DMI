\* MAIN with three packs in chunks of two (a split, a second chunk),
\* close() but no crash and no user flush (PackPipeline_main has those).
\* EXPECT: HOLDS.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Packs = {1, 2, 3}
  Chunk = 2
  ReconcileOnStart = TRUE
  ReconcilePeriodic = FALSE
  MaxRestarts = 0
  MaxCrashes = 0
  MaxLeaseLosses = 1
  MaxFaults = 1
  AllowClose = TRUE
  AllowUserFlush = FALSE
  CheckLeaseBeforeFirstChunk = FALSE
  GateUploadsOnLease = TRUE
  GateUploadsOnOwed = TRUE
  ReleaseStagesTail = TRUE
  FirstBatchOnly = TRUE
  ReconcileFailuresOwed = FALSE
  FlushRunsReconcile = FALSE
INVARIANT TypeOK
INVARIANT Durable
INVARIANT CatalogSound
INVARIANT OwedAtMostOneChunk
INVARIANT OneBatchPastDeadline
INVARIANT FlushNeverReconciles
INVARIANT TailDelivered
INVARIANT FlushBoundary
INVARIANT CloseDelivers
