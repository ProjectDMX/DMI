\*=========================================================================
\* O5: a start refused the lease must leave the spool unswept.
\* test_a_start_refused_the_lease_leaves_the_spool_unswept, with
\* start_lease_wait_s = 0.  EXPECT: HOLDS.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  Services         = {s1, s2}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 0
  MaxTime          = 10
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = FALSE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = TRUE
  AllowStop        = FALSE
  MaxReacq         = 2
INVARIANT StartAlwaysSucceeds
