\* MUTATION: a child forked without exec keeps its copies of the lock
\* descriptions (no pthread_atfork handler).  The parent dies, the child
\* lives on, and the dead directory reads as live forever.  Run with the
\* recheck fix and per-service leases, so the gap of _live_multi does not
\* mask it.
\* EXPECT: VIOLATED (AdoptLive).
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {s, q}
  Stagers          = {s, q}
  Adopters         = {s, q}
  CrashProcs       = {q}
  Survivor         = s
  BadProcs         = {}
  MaxQuar          = 0
  ReconcileOnStart = TRUE
  RescanAlways     = TRUE
  SkipFileCheck    = FALSE
  SkipDirLock      = FALSE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = TRUE
  NoLeaseGate      = FALSE
  ExclusiveLease   = FALSE
  Track            = FALSE
PROPERTY AdoptLive
