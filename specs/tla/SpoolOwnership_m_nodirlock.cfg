\* MUTATION: LockInPlace without LockDirectory.  A remover unlinks the
\* lock file before its rmdir (ReleaseAndRemoveIfEmpty); in that window the
\* directory reads as unowned, and a second adopter creates a new lock file
\* and takes it while the remover still believes it owns the directory.
\* Several services at once (ExclusiveLease FALSE), so two adopters race.
\* EXPECT: VIOLATED (MutualExclusion).
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {p1, p2, p3}
  Stagers          = {p1}
  Adopters         = {p2, p3}
  CrashProcs       = {p1, p2, p3}
  Survivor         = NoP
  BadProcs         = {}
  MaxQuar          = 0
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = FALSE
  SkipDirLock      = TRUE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = FALSE
  Track            = FALSE
INVARIANT MutualExclusion
SYMMETRY AdopterPerms
