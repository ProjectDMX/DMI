\* noovr0 (empty refs, MaxTerm 4, cap enforced) with the #159 timeouts: any
\* request may time out, the writer drops its lease untombstoned, and what it
\* sent may still land.  EXPECT: AllSafety HOLDS.  Partner: to_ovr0.
SPECIFICATION Spec
CONSTANTS
  Publishers = {p1, p2}
  SelfRace   = FALSE
  Lids       = {1, 2, 3}
  MaxTerm    = 4
  MaxTime    = 8
  MaxVersion = 2
  MaxAttempts = 1
  TTL  = 2
  PT   = 1
  SKEW = 0
  NumChunks = 0
  Linearizable   = TRUE
  AllowOverrun   = FALSE
  WriterLock     = TRUE
  FreshPublishId = TRUE
  Timeouts       = TRUE
CONSTRAINT Bound
INVARIANT AllSafety
CHECK_DEADLOCK FALSE
