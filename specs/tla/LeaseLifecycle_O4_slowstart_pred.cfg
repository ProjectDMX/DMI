\*=========================================================================
\* One timed-out claim at start AND a crashed predecessor's live row (its
\* TTL equal to ours).  The default wait is sized for the predecessor's row;
\* a claim whose head read times out at the end of it, with nothing sent,
\* is not given the stretch a quarantine gets (storage_service.cpp:1588-1602),
\* so start() fails.  EXPECT: REFUTED (StartPastOneSlowClaim): the wait
\* covers a predecessor or one slow claim, not both.
\*=========================================================================
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTRAINT StartPhaseOnly
CONSTANTS
  Services         = {s1}
  TTL              = 6
  PT               = 1
  Skew             = 0
  PredTTL          = 6
  StartWait        = 7
  MaxTime          = 24
  MaxLate          = 0
  Foreign          = FALSE
  ForeignStops     = FALSE
  ForeignBudget    = 0
  ForeignStopBy    = 0
  MaxCuts          = 0
  AllowUnknown     = TRUE
  AllowSkipPublish = FALSE
  ReuseLid         = FALSE
  CycleOn          = FALSE
  PredHolds        = TRUE
  AllowStop        = FALSE
  MaxReacq         = 2
  MaxReq           = 3
  CfgSkew          = 0
  RivalEarly       = 0
  SameSpool        = FALSE
  OwnerLock        = TRUE
  LateStart        = FALSE
  AllowCrash       = FALSE
INVARIANT StartPastOneSlowClaim
