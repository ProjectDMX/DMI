\* Liveness of charge_dead_siblings: what s's sink is charged for a dead
\* sibling (ChargedSiblingBytes, spool.cpp:1357-1407) is eventually given
\* back.  Same takeover as _live_takeover.
\* EXPECT: VIOLATED (ChargeDrains): q's dead backlog is charged against s's
\* sink for as long as s runs.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {s, q}
  Stagers          = {s, q}
  Adopters         = {s, q}
  CrashProcs       = {q}
  Survivor         = s
  BadProcs         = {}
  MaxQuar          = 1
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = FALSE
  SkipDirLock      = FALSE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = TRUE
  Track            = FALSE
PROPERTY ChargeDrains
