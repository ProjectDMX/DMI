\* The real protocol: three processes, each claiming its own rank
\* directory, any of which may crash or close, adopting each other's; one
\* lease quarantine, so a second service can take the lease over while the
\* first is still inside an adoption.
\* MANUAL (long).
\* EXPECT: HOLDS.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NoP    = NoP
  NoPack = NoPack
  Procs            = {p1, p2, p3}
  Stagers          = {p1, p2, p3}
  Adopters         = {p1, p2, p3}
  CrashProcs       = {p1, p2, p3}
  Survivor         = NoP
  BadProcs         = {}
  MaxQuar          = 1
  ReconcileOnStart = TRUE
  RescanAlways     = FALSE
  SkipFileCheck    = FALSE
  SkipDirLock      = FALSE
  SinkFirst        = FALSE
  ReleaseUnsealed  = FALSE
  NoAtfork         = FALSE
  NoLeaseGate      = FALSE
  ExclusiveLease   = TRUE
  Track            = FALSE
INVARIANT TypeOK MutualExclusion NoClobber NoLostPack NoConcurrentUpload OwedBounded NoOrphan BlockedLetGo UploadOnlyWithLease
SYMMETRY Perms
