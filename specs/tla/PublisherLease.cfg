\*===========================================================================
\* PublisherLease.cfg -- THE BASE MODEL: the protocol exactly as shipped.
\*
\*   Linearizable    TRUE  = deciding_read() really is sequentially
\*                           consistent (clickhouse_client.cpp:107)
\*   AllowOverrun    FALSE = max_execution_time is honoured
\*                           (catalog_writer.cpp:519-520)
\*   WriterLock      TRUE  = the re-entrant writer lock (doc :535)
\*   FreshPublishId  TRUE  = publish_id minted per call
\*                           (catalog_writer.cpp:529)
\*   SelfRace        FALSE = each Publisher is its own writer
\*
\* Sibling configs in this directory, each a single knob turned, with the
\* verdict TLC returned.  Full results table and run commands: specs/README.md.
\* Counterexample lengths below are the traces TLC printed on the recorded
\* run; parallel BFS does not guarantee a minimal trace, so a re-run may
\* report a different length for the same violation.
\*
\*   PublisherLease_base5.cfg        base with MaxTerm 5 / MaxTime 8 -- the
\*                                   term budget the takeover race needs
\*   PublisherLease_noovr0.cfg       empty-refs publish, cap ENFORCED
\*                                     -> NoOverlappingAdmit HOLDS (799,611)
\*   PublisherLease_ovr0.cfg         same, cap may be OVERRUN (doc :503)
\*                                     -> NoOverlappingAdmit VIOLATED (17)
\*   PublisherLease_holders.cfg      -> AtMostOneHolder VIOLATED (11)
\*   PublisherLease_holderssafe.cfg  -> TwoHoldersIsSafe HOLDS (9,665,700)
\*   PublisherLease_believers.cfg    -> AtMostOneBeliever HOLDS (9,665,700)
\*   PublisherLease_orphans.cfg      -> NoOrphanManifestRows VIOLATED (9)
\*   PublisherLease_selfrace.cfg     -> WatermarkMonotonic VIOLATED (29)
\*   PublisherLease_selfracelocked.cfg -> AllSafety HOLDS (524,274)
\*   PublisherLease_chunks2*.cfg     two manifest chunks
\*   PublisherLease_nonlin_*.cfg     Linearizable = FALSE
\*   PublisherLease_vac*.cfg         vacuity guards -- every one of these is
\*                                   EXPECTED to be refuted; the trace proves
\*                                   the model reaches the state the safety
\*                                   invariants are quantified over
\*===========================================================================
SPECIFICATION Spec
CONSTANTS
  Publishers = {p1, p2}
  SelfRace   = FALSE
  Lids       = {1, 2, 3}
  MaxTerm    = 3
  MaxTime    = 5
  MaxVersion = 2
  MaxAttempts = 2
  TTL  = 2
  PT   = 1
  SKEW = 0
  NumChunks = 1
  Linearizable   = TRUE
  AllowOverrun   = FALSE
  WriterLock     = TRUE
  FreshPublishId = TRUE
CONSTRAINT Bound
INVARIANT AllSafety
CHECK_DEADLOCK FALSE
