name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-and-package-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest wheel
          python -m pip install --no-deps -e .

      - name: Run compile, CPU, and package-layout checks
        run: make check
