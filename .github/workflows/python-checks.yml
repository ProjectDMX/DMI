name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-and-package-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest wheel numpy "clickhouse-driver>=0.2.0" "pyyaml>=6.0.0"
          # DMI-configurator's [ui] extra. Without fastapi and httpx the API
          # contract suite skips itself rather than failing, so the whole
          # backend would go untested on every PR.
          python -m pip install "fastapi>=0.115" "uvicorn>=0.30" "httpx>=0.28"
          python -m pip install --no-deps -e .

      - name: Run compile, CPU, and package-layout checks
        run: make check
