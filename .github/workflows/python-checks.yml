name: Python checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-and-package-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest wheel numpy "clickhouse-driver>=0.2.0" "pyyaml>=6.0.0"
          # DMI-configurator's [ui] extra. Without fastapi and httpx the API
          # contract suite skips itself rather than failing, so the whole
          # backend would go untested on every PR.
          python -m pip install "fastapi>=0.115" "uvicorn>=0.30" "httpx>=0.28"
          python -m pip install --no-deps -e .

      - name: Run compile, CPU, and package-layout checks
        run: make check

  clickhouse-live:
    # The `manual`-marked suites, which `make check` cannot run: `addopts` in
    # pyproject.toml carries `-m 'not manual'`, so every test that needs a real
    # server was deselected everywhere, CI included. That left the catalog's
    # load-bearing regression -- tests/test_clickhouse_schema_migration_live.py,
    # which holds `main`'s DDL verbatim and the measured `skipped=2 indexed=0`
    # data-loss path -- passing on nobody's machine on any schedule. A CLI `-m`
    # overrides the one in `addopts`, which is what selects them back in here.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      clickhouse:
        # Pinned, and pinned to the version the suites were written against:
        # tests/_catalog_fakes.py records UUID collation as "verified on 25.12",
        # and that ordering is what the lease fence resolves a contested head
        # with. A floating tag would move that out from under the fakes.
        image: clickhouse/clickhouse-server:25.12
        env:
          # Without this the image's entrypoint writes a users.d override
          # restricting `default` to ::1 and 127.0.0.1 -- it says so in the
          # container log: "neither CLICKHOUSE_USER nor CLICKHOUSE_PASSWORD is
          # set, disabling network access for user 'default'". The health check
          # below still passes, because clickhouse-client runs INSIDE the
          # container and so connects from localhost, while the suites connect
          # from the runner host and got `Code: 516, Authentication failed` on
          # all 61 tests. Skipping the entrypoint's user setup leaves `default`
          # as the stock config has it: no password, no network restriction.
          # The suites take only host/port/database from the environment and
          # have no way to present credentials, so opening `default` up is the
          # fix rather than creating a user.
          CLICKHOUSE_SKIP_USER_SETUP: "1"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Not the default depth 1. The migration suite extracts its
          # predecessor's catalog writer with `git show bea3ed8:...` rather than
          # transcribing it -- a hand-copied fixture would drift towards this
          # branch and prove nothing -- and on a shallow clone that commit is
          # absent, so the test calls pytest.skip. Verified: in a depth-1 clone
          # the `git show` fails. Depth 1 would therefore reproduce the exact
          # bug this job exists to catch, reporting green while the regression
          # never ran.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest wheel numpy "clickhouse-driver>=0.2.0" "pyyaml>=6.0.0"
          # The configurator pipeline imports yaml/fastapi at module level,
          # and its suites must not silently skip here either.
          python -m pip install "fastapi>=0.115" "uvicorn>=0.30" "httpx>=0.28"
          python -m pip install --no-deps -e .

      - name: Run the ClickHouse live suites
        env:
          DMI_CLICKHOUSE_HOST: 127.0.0.1
          DMI_CLICKHOUSE_PORT: "9000"
        # `python -m pytest`, matching the Makefile. `not garage` drops the one
        # suite that also needs a Garage S3 endpoint; everything else under
        # these markers needs nothing but the server above.
        run: |
          python -m pytest -m "clickhouse and manual and not garage" \
            -q --junit-xml=live-results.xml

      - name: Fail if any live test was skipped
        if: always()
        # A skip here is indistinguishable from coverage that does not exist,
        # which is the whole finding this job answers: an unreachable server
        # raises, but a missing `clickhouse_driver` or a lost fixture commit
        # skips, and a skipped suite reports green. So a skip is an error, and
        # names itself.
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          # EVERY testsuite, not the first. pytest writes one today, but a
          # plugin (xdist among them) can split the run across several, and
          # reading only the first would report a subset as the whole -- which
          # is the failure mode this gate exists to prevent. An absent node
          # used to crash here with an AttributeError traceback; it is now a
          # named failure, because a JUnit file this script cannot read is a
          # gate that is not running.
          suites = ET.parse("live-results.xml").getroot().findall("testsuite")
          if not suites:
              sys.exit("live-results.xml has no <testsuite>: the gate cannot read it")
          ran = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          print(f"{ran} collected, {skipped} skipped, across {len(suites)} suite(s)")
          if ran == 0:
              sys.exit("no live tests ran: the marker selection matched nothing")
          if skipped:
              for suite in suites:
                  for case in suite.iter("testcase"):
                      for mark in case.iter("skipped"):
                          print(f"  skipped: {case.get('name')}: {mark.get('message')}")
              sys.exit(f"{skipped} live test(s) skipped; a skip is not a pass")
          EOF
