\* MUTATION: outcome-unknown failure writes the release tombstone instead of discarding (contra clickhouse_lease.py:113-125). Expect MutualExclusion violated (OnePublishInFlight, the same-process form, fails even earlier).
CONSTANTS
    Writers = {w1, w2}
    Ids = {1, 2, 3}
    TTL = 3
    P = 1
    S = 1
    MaxTime = 4
    MaxTerm = 4
    MaxCrashes = 0
    Unknowns = TRUE
    Mutation = "release_on_unknown"
    ClockModel = "pairwise"
SPECIFICATION Spec
SYMMETRY WritersSym
VIEW View
INVARIANTS
    MutualExclusion
CHECK_DEADLOCK FALSE
