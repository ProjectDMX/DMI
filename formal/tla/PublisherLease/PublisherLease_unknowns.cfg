\* FAITHFUL model with outcome-unknown failures (InsertUnknown, ClientError, late-landing claim rows, quarantine). Expected to pass.
CONSTANTS
    Writers = {w1, w2}
    Ids = {1, 2, 3}
    TTL = 3
    P = 1
    S = 1
    MaxTime = 4
    MaxTerm = 4
    MaxCrashes = 0
    Unknowns = TRUE
    Mutation = "none"
    ClockModel = "pairwise"
SPECIFICATION Spec
SYMMETRY WritersSym
VIEW View
INVARIANTS
    TypeOK
    MutualExclusion
    OnePublishInFlight
    NoGrantDuringFlight
    SoleGrantPerTerm
    ReleasedNeverAdmittable
    NoAdmitAfterRelease
    ReleaseNeverContestsSuccessor
PROPERTIES
    TermsMonotonic
    HeldTermMonotonic
CHECK_DEADLOCK FALSE
